<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!--
    SKILL: anbeime/skill/ip-as-logo
    - 3 Semantic Colors:
      1. Background: Solid Muted Abyssal Navy (#0A1428)
      2. IP Color 1 (Primary Body & Paired Wave-Cloud Wings): Luminous Ocean Cyan (#00B4D8)
      3. IP Color 2 (Belly Mass & Forehead Star Crest): Celestial Aurora Violet (#8B5CF6)
    - Composition: Emerging from lower-left corner, filling ~88% of canvas, upright, readable at 32x32.
    - Complexity Budget: 5 large rounded shapes, 2 simple dark eyes, blunt rounded ends.
  -->
  <defs>
    <clipPath id="squareClip">
      <rect width="512" height="512" rx="88" />
    </clipPath>
    <linearGradient id="ipBodyCyan" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
    <linearGradient id="ipWingCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <linearGradient id="ipViolet" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>

  <g clip-path="url(#squareClip)">
    <!-- 1. Solid Muted Abyssal Navy Background (#0A1428) -->
    <rect width="512" height="512" fill="#0A1428" />

    <!-- 2. Paired Wave-Cloud Wing Fins (Both members visible per ip-as-logo rule) -->
    <!-- Left Wing Fin emerging from lower-left edge -->
    <path d="M -32,236
             C 36,228 96,216 136,172
             L 124,396
             C 68,368 12,336 -32,312 Z"
          fill="url(#ipWingCyan)" />

    <!-- Right Wing Fin with thick blunt rounded tip -->
    <path d="M 356,256
             C 376,320 448,358 456,412
             C 462,452 424,468 372,466
             C 312,464 268,468 232,482
             Z"
          fill="url(#ipWingCyan)" />

    <!-- 3. Dominant Continuous Outer Silhouette (Rounded Manta-Whale Head & Torso emerging from lower-left) -->
    <path d="M 42,532
             C 88,468 92,380 104,284
             C 118,162 184,96 268,104
             C 354,112 384,186 368,284
             C 352,380 282,476 176,532 Z"
          fill="url(#ipBodyCyan)" />

    <!-- Subtle Neo-Skeuomorphic Top Rim Highlight -->
    <path d="M 116,238
             C 134,152 192,102 268,108
             C 338,114 372,168 368,242"
          fill="none"
          stroke="#67E8F9"
          stroke-width="8"
          stroke-linecap="round"
          opacity="0.55" />

    <!-- 4. Secondary Color Region: Broad Purposeful Belly Mass in Aurora Violet (#8B5CF6) -->
    <path d="M 112,486
             C 116,386 144,296 208,300
             C 272,304 288,376 254,442
             C 226,496 148,518 112,486 Z"
          fill="url(#ipViolet)" />

    <!-- 5. Defining Feature: Blunt-Rounded 5-Point Star Crest on Forehead (Reusing Secondary IP Color) -->
    <path d="M 262,132
             L 274,152 L 296,158
             L 280,174 L 282,196
             L 262,186 L 242,196
             L 244,174 L 228,158
             L 250,152 Z"
          fill="url(#ipViolet)"
          stroke="url(#ipViolet)"
          stroke-width="10"
          stroke-linejoin="round" />

    <!-- 6. Facial Marks: Two Widely Spaced Simple Dark Eyes (Reusing Background Color #0A1428) -->
    <circle cx="178" cy="218" r="16" fill="#0A1428" />
    <circle cx="300" cy="244" r="16" fill="#0A1428" />
  </g>
</svg>
